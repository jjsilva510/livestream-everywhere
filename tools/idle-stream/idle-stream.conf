# Idle-stream config (VPS: /root/idle-stream/idle-stream.conf)
# Source: YouTube playlist (uploads playlist of channel UCuHB4k08tK_vb38yPabxyFQ)
PLAYLIST_URL="https://www.youtube.com/playlist?list=UUuHB4k08tK_vb38yPabxyFQ"
# Android client yields a COMBINED avc1+mp4a mp4 (itag 18, 360p) — the only form
# that pipes cleanly through ffmpeg -> FLV/RTMP (720p+ is DASH-segmented only).
CLIENT_ARGS="youtube:player_client=android"
FORMAT="b[height<=360][ext=mp4]/b[height<=720][ext=mp4]/b[height<=720]/b"
RTMP_BASE="rtmp://127.0.0.1:1936/live"  # 1935 is Owncast; MediaMTX RTMP is 1936 (rtmpAddress in mediamtx.yml)
STREAM_KEY=""  # filled at install time
YTDL_RATE_LIMIT="4M"
